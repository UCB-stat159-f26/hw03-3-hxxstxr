[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-analysis"
version = "0.1.0"
description = "Analyze and visualize tennis players' career matches"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "requests>=2.28"
]

[tool.setuptools.packages.find]
include = ["tennis_analysis*"]